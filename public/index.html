<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anniversary</title>
<meta name="description" content="A small corner of the internet for our anniversary.">
<link rel="canonical" href="https://anniversary.hwilt.com/">

<!-- Kept out of search results. This one is just for us. -->
<meta name="robots" content="noindex, nofollow">

<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/home.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

<div class="wrap">

  <header class="hero" id="top">
    <div class="eyebrow">since <!-- TODO: set the real date here and in data-since below -->January 1, 2024</div>
    <h1>Us</h1>
  </header>

  <svg class="contour" viewBox="0 0 880 28" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,25.5 C10.5,23.4 41.9,14.3 62.9,12.9 C83.8,11.6 104.8,18.1 125.7,17.3 C146.7,16.6 167.6,9.2 188.6,8.6 C209.5,8.1 230.5,14.5 251.4,14.1 C272.4,13.6 293.3,6.4 314.3,5.9 C335.2,5.4 356.2,11.6 377.1,11.1 C398.1,10.6 419,3.4 440,3.1 C461,2.7 481.9,6.9 502.9,8.9 C523.8,10.9 544.8,14.5 565.7,14.9 C586.7,15.3 607.6,10.4 628.6,11.2 C649.5,11.9 670.5,18.5 691.4,19.3 C712.4,20.2 733.3,15.7 754.3,16.2 C775.2,16.7 796.2,20.8 817.1,22.1 C838.1,23.5 869.5,24 880,24.4" />
  </svg>

  <!-- data-since drives the counter in js/counter.js. Set it to the real date
       (YYYY-MM-DD) and the numbers below fill themselves in. -->
  <section class="counter" data-since="2024-01-01">
    <div class="count-row">
      <div class="count">
        <span class="num" data-count="days">—</span>
        <span class="unit">days</span>
      </div>
      <div class="count">
        <span class="num" data-count="years">—</span>
        <span class="unit">years</span>
      </div>
    </div>
    <p class="next-up" data-next-up></p>
  </section>

  <footer>
    made with love
  </footer>

</div>

<script src="/js/counter.js" defer></script>

</body>
</html>
